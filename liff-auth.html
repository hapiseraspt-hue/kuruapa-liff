<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>くるアパ 発注</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  body{font-family:-apple-system,"Helvetica Neue",sans-serif;background:#f5f5f3;color:#1d1d1b;margin:0}
  .box{max-width:420px;margin:60px auto;padding:24px;text-align:center}
  .msg{font-size:15px;color:#555}
  .err{font-size:15px;color:#a32d2d}
</style>
</head>
<body>
<div class="box">
  <div id="msg" class="msg">LINEで本人確認中…</div>
</div>

<script>
  var LIFF_ID = "2010259050-0aPwjKfu";
  var GAS_URL = "https://script.google.com/macros/s/AKfycbzNuO4C5hRess3-HXk12guWH36LOGy0VyvQ-njYNhu_-iJ2i9Xfie5alKuZ56F2VX3b/exec";
</script>

<script>
  function showErr(m){ document.getElementById("msg").className = "err"; document.getElementById("msg").innerHTML = m; }

  // リッチメニューの枠ごとに行き先を変えられるようにする。
  // 例: https://liff.line.me/2010259050-0aPwjKfu?to=share → 販売実績の投稿画面
  //     to を付けなければ、これまでどおり発注画面。
  function destPage(){
    var re = /[?&]to=([A-Za-z0-9_-]{1,20})/;
    var m = location.search.match(re);
    if (m) return m[1];
    // 初回起動時は LIFF が ?liff.state=%3Fto%3Dshare の形で包んでくることがある
    var st = location.search.match(/[?&]liff\.state=([^&]+)/);
    if (st) {
      try { var m2 = decodeURIComponent(st[1]).match(re); if (m2) return m2[1]; } catch (e) {}
    }
    return "";
  }

  function go(uid, dname){
    var f = document.createElement("form");
    f.method = "POST";
    f.action = GAS_URL;
    var i = document.createElement("input");
    i.type = "hidden"; i.name = "uid"; i.value = uid;
    f.appendChild(i);
    var to = destPage();
    if (to) {
      var i3 = document.createElement("input");
      i3.type = "hidden"; i3.name = "page"; i3.value = to;
      f.appendChild(i3);
    }
    var i2 = document.createElement("input");
    i2.type = "hidden"; i2.name = "dname"; i2.value = (dname || "");
    f.appendChild(i2);
    document.body.appendChild(f);
    f.submit();
  }

  if (typeof liff === "undefined") {
    showErr("読み込みに失敗しました。LINEアプリから開いてください。");
  } else {
    liff.init({ liffId: LIFF_ID }).then(function () {
      if (!liff.isLoggedIn()) { liff.login(); return; }
      return liff.getProfile().then(function (p) { go(p.userId, p.displayName); });
    }).catch(function (err) {
      showErr("LINEアプリから開いてください。（" + err + "）");
    });
  }
</script>
</body>
</html>
